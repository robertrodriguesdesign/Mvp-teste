<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fihan — Design System / Menu Hamburger</title>
  <style>
    :root {
      --bg: #EDEDED;
      --card-bg: #FFFFFF;
      --border: #DCDCDC;
      --text: #202224;
      --text-dim: #6B6F73;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 40px 80px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 { font-size: 20px; margin: 0 0 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 16px;
      max-width: 560px;
    }
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .cell img { width: 48px; height: 48px; }
    .label {
      font-size: 11px;
      color: var(--text-dim);
      font-family: ui-monospace, "IBM Plex Mono", monospace;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Menu Hamburger — Fihan</h1>
  <div class="grid">
    <div class="cell">
      <img src="../../images/icons/ui/menu-hamburger-fechado-stroke.svg" alt="Menu fechado, com borda" />
      <span class="label">fechado, stroke=true</span>
    </div>
    <div class="cell">
      <img src="../../images/icons/ui/menu-hamburger-aberto-stroke.svg" alt="Menu aberto, com borda" />
      <span class="label">aberto, stroke=true</span>
    </div>
    <div class="cell">
      <img src="../../images/icons/ui/menu-hamburger-fechado.svg" alt="Menu fechado, sem borda" />
      <span class="label">fechado, stroke=false</span>
    </div>
    <div class="cell">
      <img src="../../images/icons/ui/menu-hamburger-aberto.svg" alt="Menu aberto, sem borda" />
      <span class="label">aberto, stroke=false</span>
    </div>
  </div>
</body>
</html>
