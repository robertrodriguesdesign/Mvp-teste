<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fihan — Design System / Input</title>
  <style>
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("../../fonts/ibm-plex-mono/IBMPlexMono-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    :root {
      --page-bg: #202224;
      --text-dim: #9A9EA1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 40px 80px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: #F9F9F9;
    }
    h1 { font-size: 20px; margin: 0 0 8px; color: #F9F9F9; }
    h2 { font-size: 13px; margin: 40px 0 16px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .hint { font-size: 12px; color: var(--text-dim); margin: 0; }

    .stack { display: flex; flex-direction: column; gap: 24px; max-width: 520px; }
    .state-label {
      font-size: 11px;
      color: var(--text-dim);
      font-family: ui-monospace, "IBM Plex Mono", monospace;
      margin-bottom: 8px;
    }

    /* Info field (label + input) */
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .field__label {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: -0.0273em;
      color: #F9F9F9;
    }
    .field__box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid #757677;
      background: transparent;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 15px;
      color: #494B4B;
      width: 100%;
    }
    .field__box input {
      all: unset;
      flex: 1;
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }
    .field__box input::placeholder { color: #494B4B; }

    .field--focus .field__box,
    .field__box:focus-within {
      background: #161917;
      border-color: #14CC52;
      box-shadow: 0 0 0 3px rgba(21, 128, 52, 0.25);
    }
    .field--focus .field__box input,
    .field__box:focus-within input { color: #F9F9F9; }

    .field--filled .field__box {
      background: #161917;
      color: #F9F9F9;
    }

    .field--disabled .field__label { color: #494B4B; }
    .field--disabled .field__box {
      background: #161917;
      color: #494B4B;
      cursor: not-allowed;
    }

    .field--warning .field__box {
      background: #161917;
      border-color: #D45113;
      box-shadow: 0 0 0 3px rgba(85, 45, 27, 1);
    }
    .field--warning .field__box input { color: #F9F9F9; }
    .field__warning-text {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 15px;
      color: #D45113;
      margin-top: 2px;
    }

    /* Search field (with icon button) */
    .search-field {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .search-field .field__box { flex: 1; }
    .icon-btn {
      flex-shrink: 0;
      width: 47px;
      height: 47px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #757677;
      border-left: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }
    .icon-btn img { width: 21.5px; height: 22.3px; }
    .search-field.field--focus .icon-btn,
    .search-field:focus-within .icon-btn { border-color: #14CC52; }
    .search-field.field--filled .icon-btn,
    .search-field.field--disabled .icon-btn { background: #161917; }
    .search-field.field--warning .icon-btn {
      border-color: #D45113;
      background: #161917;
    }
  </style>
</head>
<body>
  <h1>Input — Fihan</h1>
  <p class="hint">IBM Plex Mono · campo de busca (com ícone) e campo com label · 5 estados cada</p>

  <h2>Input Search</h2>
  <div class="stack">
    <div>
      <div class="state-label">default</div>
      <div class="search-field field">
        <div class="field__box">
          <input type="text" placeholder="Buscar documentação, API, funções..." />
        </div>
        <button class="icon-btn" type="button" aria-label="Buscar"><img src="../../images/icons/ui/icon-lupa.svg" alt="" /></button>
      </div>
    </div>
    <div>
      <div class="state-label">focado</div>
      <div class="search-field field field--focus">
        <div class="field__box">
          <input type="text" value="Plataforma" />
        </div>
        <button class="icon-btn" type="button" aria-label="Buscar"><img src="../../images/icons/ui/icon-lupa.svg" alt="" /></button>
      </div>
    </div>
    <div>
      <div class="state-label">preenchido</div>
      <div class="search-field field field--filled">
        <div class="field__box">
          <input type="text" value="Plataforma" readonly />
        </div>
        <button class="icon-btn" type="button" aria-label="Buscar"><img src="../../images/icons/ui/icon-lupa.svg" alt="" /></button>
      </div>
    </div>
    <div>
      <div class="state-label">inativo</div>
      <div class="search-field field field--disabled">
        <div class="field__box">
          <input type="text" placeholder="Buscar documentação, API, funções..." disabled />
        </div>
        <button class="icon-btn" type="button" aria-label="Buscar" disabled><img src="../../images/icons/ui/icon-lupa.svg" alt="" /></button>
      </div>
    </div>
    <div>
      <div class="state-label">aviso</div>
      <div class="search-field field field--warning">
        <div class="field__box">
          <input type="text" placeholder="Buscar documentação, API, funções..." />
        </div>
        <button class="icon-btn" type="button" aria-label="Buscar"><img src="../../images/icons/ui/icon-lupa.svg" alt="" /></button>
      </div>
      <div class="field__warning-text">campo obrigatório *</div>
    </div>
  </div>

  <h2>Input Info</h2>
  <div class="stack">
    <div class="field">
      <div class="state-label">default</div>
      <label class="field__label">Seu nome completo</label>
      <div class="field__box">
        <input type="text" placeholder="Ex: Maria Silva" />
      </div>
    </div>
    <div class="field field--focus">
      <div class="state-label">focado</div>
      <label class="field__label">Seu nome completo</label>
      <div class="field__box">
        <input type="text" value="Ex: Maria Silva" />
      </div>
    </div>
    <div class="field field--filled">
      <div class="state-label">preenchido</div>
      <label class="field__label">Seu nome completo</label>
      <div class="field__box">
        <input type="text" value="Ex: Maria Silva" readonly />
      </div>
    </div>
    <div class="field field--disabled">
      <div class="state-label">inativo</div>
      <label class="field__label">Seu nome completo</label>
      <div class="field__box">
        <input type="text" placeholder="Ex: Maria Silva" disabled />
      </div>
    </div>
    <div class="field field--warning">
      <div class="state-label">aviso</div>
      <label class="field__label">Seu nome completo</label>
      <div class="field__box">
        <input type="text" placeholder="Ex: Maria Silva" />
      </div>
      <div class="field__warning-text">campo obrigatório *</div>
    </div>
  </div>
</body>
</html>
