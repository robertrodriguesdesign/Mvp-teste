<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fihan — Design System / Terminal</title>
  <style>
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("../../fonts/ibm-plex-mono/IBMPlexMono-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("../../fonts/ibm-plex-mono/IBMPlexMono-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("../../fonts/ibm-plex-mono/IBMPlexMono-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }
    :root {
      --page-bg: #202224;
      --text-dim: #9A9EA1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 40px 100px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: #F9F9F9;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    h2 { font-size: 13px; margin: 48px 0 24px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .hint { font-size: 12px; color: var(--text-dim); margin: 0; }

    .terminal { width: 578px; background: #161917; font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .terminal__dots { display: flex; align-items: center; gap: 16px; padding: 24px; }
    .terminal__dots img { width: 15.08px; height: 15.08px; }
    .terminal__body { display: flex; align-items: center; gap: 33px; width: 537px; margin: 0 auto; padding-bottom: 24px; }
    .terminal__nums { display: flex; flex-direction: column; justify-content: center; gap: 15px; padding: 16px 23px; }
    .terminal__lines { flex: 1; display: flex; flex-direction: column; gap: 26px; }
    .terminal__lines p { margin: 0; }

    /* Detalhado */
    .terminal--detalhado {
      box-shadow: 24px 24px 0px -7px rgba(20, 204, 82, 1);
      margin-right: 24px;
      margin-bottom: 24px;
    }
    .terminal--detalhado .terminal__dots { border: 1px solid #14CC52; }
    .terminal--detalhado .terminal__nums {
      border-right: 1px solid #14CC52;
      border-bottom: 1px solid #14CC52;
    }
    .terminal--detalhado .terminal__nums span { font-size: 32px; font-weight: 600; letter-spacing: -0.0003em; color: #FFFFFF; }
    .terminal--detalhado .terminal__lines p { font-size: 24px; font-weight: 600; letter-spacing: -0.0125em; color: #FFFFFF; }
    .terminal--detalhado .terminal__lines p:last-child { color: #14CC52; }

    /* Simples */
    .terminal--simples {
      border: 2px solid #757677;
      padding-bottom: 20px;
    }
    .terminal--simples .terminal__nums span { font-size: 18px; font-weight: 500; color: #FFFFFF; }
    .terminal--simples .terminal__lines p { font-size: 15px; font-weight: 400; color: #FFFFFF; }
  </style>
</head>
<body>
  <h1>Terminal — Fihan</h1>
  <p class="hint">card estilo console/terminal · IBM Plex Mono</p>

  <h2>Detalhado</h2>
  <div class="terminal terminal--detalhado">
    <div class="terminal__dots">
      <img src="../../images/icons/ui/dot-simples.svg" alt="" />
      <img src="../../images/icons/ui/dot-simples.svg" alt="" />
      <img src="../../images/icons/ui/dot-simples.svg" alt="" />
    </div>
    <div class="terminal__body">
      <div class="terminal__nums">
        <span>1</span>
        <span>2</span>
        <span>3</span>
      </div>
      <div class="terminal__lines">
        <p>Negócio / Diagnóstico concluído</p>
        <p>Marca / DNA validado</p>
        <p>/ Desenvolvimento em execução</p>
      </div>
    </div>
  </div>

  <h2>Simples</h2>
  <div class="terminal terminal--simples">
    <div class="terminal__dots">
      <img src="../../images/icons/ui/dot-simples.svg" alt="" />
      <img src="../../images/icons/ui/dot-simples.svg" alt="" />
      <img src="../../images/icons/ui/dot-simples.svg" alt="" />
    </div>
    <div class="terminal__body">
      <div class="terminal__nums">
        <span>1</span>
        <span>2</span>
        <span>3</span>
      </div>
      <div class="terminal__lines">
        <p># FIHAN / Protocolo iniciado</p>
        <p># Solução pronta para deploy</p>
        <p># Negócio / Marca / Dev</p>
      </div>
    </div>
  </div>
</body>
</html>
