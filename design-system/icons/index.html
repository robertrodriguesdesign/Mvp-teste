<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fihan — Design System / Ícones</title>
  <style>
    :root {
      --bg: #EDEDED;
      --card-bg: #FFFFFF;
      --border: #DCDCDC;
      --text: #202224;
      --text-dim: #6B6F73;
      --accent: #8A38F5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 40px 80px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    h1 { font-size: 20px; margin: 0; }
    .count {
      font-size: 13px;
      color: var(--text-dim);
      font-family: ui-monospace, "IBM Plex Mono", monospace;
    }
    .search-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: 8px 0 16px;
    }
    input[type="search"] {
      width: 100%;
      max-width: 420px;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
    }
    input[type="search"]:focus {
      border-color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
    }
    .icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 8px 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.12s ease;
    }
    .icon-card:hover { border-color: var(--accent); }
    .icon-card img { width: 22px; height: 22px; }
    .icon-card .name {
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      word-break: break-word;
      line-height: 1.3;
      font-family: ui-monospace, "IBM Plex Mono", monospace;
    }
    .empty {
      text-align: center;
      color: var(--text-dim);
      padding: 60px 0;
      display: none;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-family: ui-monospace, "IBM Plex Mono", monospace;
      opacity: 0;
      pointer-events: none;
      transition: all 0.15s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <h1>Família Iconográfica — Fihan</h1>
    <span class="count"><span id="visibleCount">1173</span> / 1173 ícones · 24×24 · stroke 2px</span>
  </header>
  <div class="search-bar">
    <input type="search" id="search" placeholder="Buscar ícone (ex: arrow, user, calendar)..." autocomplete="off" />
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">Nenhum ícone encontrado.</p>
  <div class="toast" id="toast">Copiado!</div>

  <script>
    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const empty = document.getElementById('empty');
    const visibleCount = document.getElementById('visibleCount');
    const toast = document.getElementById('toast');

    fetch('icons.json')
      .then(r => r.json())
      .then(names => {
        const cards = names.map(name => {
          const card = document.createElement('div');
          card.className = 'icon-card';
          card.dataset.name = name;
          card.innerHTML = `<img src="../../images/icons/${name}.svg" alt="${name}" loading="lazy" width="24" height="24" />
            <span class="name">${name}</span>`;
          card.addEventListener('click', () => {
            navigator.clipboard.writeText(name).catch(() => {});
            toast.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), 900);
          });
          grid.appendChild(card);
          return card;
        });

        search.addEventListener('input', () => {
          const q = search.value.trim().toLowerCase();
          let visible = 0;
          cards.forEach(card => {
            const match = card.dataset.name.includes(q);
            card.style.display = match ? '' : 'none';
            if (match) visible++;
          });
          visibleCount.textContent = visible;
          empty.style.display = visible === 0 ? 'block' : 'none';
        });
      });
  </script>
</body>
</html>
