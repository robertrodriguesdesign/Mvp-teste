<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fihan — Design System / Card Info</title>
  <style>
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("../../fonts/ibm-plex-mono/IBMPlexMono-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    :root {
      --page-bg: #202224;
      --text-dim: #9A9EA1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 40px 80px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: #F9F9F9;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    h2 { font-size: 13px; margin: 32px 0 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .hint { font-size: 12px; color: var(--text-dim); margin: 0; }

    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }

    .card-simple {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 218px;
      padding: 24px;
      border: 1px solid #494B4B;
    }
    .card-simple__title,
    .card-simple__desc {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 15px;
      color: #FFFFFF;
      margin: 0;
    }
    .card-simple .ghost-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      padding: 0;
      color: #14CC52;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 15px;
      cursor: pointer;
    }
    .card-simple .ghost-link svg { width: 14.51px; height: 10.4px; transition: transform 0.15s ease; }
    .card-simple .ghost-link:hover svg { transform: translateX(2px); }

    .card-complex {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 401px;
      padding: 24px;
      border: 1px solid #494B4B;
    }
    .card-complex__icon {
      flex-shrink: 0;
      width: 120px;
      height: 120px;
    }
    .card-complex__body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card-complex__body p {
      margin: 0;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 15px;
      color: #FFFFFF;
    }
    .card-complex__arrow {
      flex-shrink: 0;
      width: 26.97px;
      height: 26.98px;
    }
  </style>
</head>
<body>
  <h1>Card Info — Fihan</h1>
  <p class="hint">card=simples (218px) e card=complex (401px) · borda #494B4B</p>

  <div class="row">
    <div class="card-simple">
      <p class="card-simple__title">API Service</p>
      <p class="card-simple__desc">Conecte e consuma dados de validação</p>
      <button class="ghost-link" type="button">
        Ver docs
        <svg viewBox="0 0 15 11" fill="none"><path d="M8.01037 2.15005H10.1604V0H8.01037V2.15005Z" fill="currentColor"/><path d="M10.1609 4.30235H12.3109V2.15H10.1609V4.30235Z" fill="currentColor"/><path d="M8.01037 10.7525H10.1604V8.60011H8.01037V10.7525Z" fill="currentColor"/><path d="M10.1609 8.60244H12.3109V6.45239H10.1609V8.60244Z" fill="currentColor"/><path d="M9.62339 4.56969H0V6.18281H9.62339V4.56969Z" fill="currentColor"/><path d="M12.3104 6.45244H14.9997V4.30239H12.3104V6.45244Z" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="card-complex">
      <img class="card-complex__icon" src="../../images/arrows/superarrow-verde.svg" alt="" />
      <div class="card-complex__body">
        <p>API Protocolo</p>
        <p>Conecte e consuma serviço de dados.</p>
        <p>Protocolo Fihan</p>
      </div>
      <img class="card-complex__arrow" src="../../images/icons/nav-arrows/seta-nav-cima-direita-grande.svg" alt="" />
    </div>
  </div>
</body>
</html>
