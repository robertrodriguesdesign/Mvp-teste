<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fihan — Design System / Selectable Card</title>
  <style>
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("../../fonts/ibm-plex-mono/IBMPlexMono-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("../../fonts/ibm-plex-mono/IBMPlexMono-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }

    :root {
      --bg: #EDEDED;
      --text-dim: #6B6F73;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 40px 80px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #202224;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .hint { font-size: 12px; color: var(--text-dim); margin: 0 0 32px; }

    .col { display: flex; flex-direction: column; gap: 10px; max-width: 345px; }

    /* Selectable Card component */
    .selectable-card {
      display: flex;
      align-items: center;
      gap: 24px;
      width: 345px;
      padding: 16px;
      border: 1px solid #AEB1B5;
      background: none;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }
    .selectable-card__text {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .selectable-card__title {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 600;
      font-size: 24px;
      letter-spacing: -0.0125em;
      color: #888C91;
      margin: 0;
    }
    .selectable-card__desc {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 400;
      font-size: 14px;
      color: #888C91;
      margin: 0;
    }
    .selectable-card__check {
      flex-shrink: 0;
      width: 46.67px;
      height: 46.67px;
    }

    .selectable-card.is-selected {
      border-color: #14CC52;
    }
    .selectable-card.is-selected .selectable-card__title,
    .selectable-card.is-selected .selectable-card__desc {
      color: #202224;
    }
  </style>
</head>
<body>
  <h1>Selectable Card — Fihan</h1>
  <p class="hint">345px · borda 1px (verde #14CC52 quando selecionado, cinza #AEB1B5 quando não) · checkbox 46.67px</p>

  <div class="col">
    <button class="selectable-card is-selected" type="button" aria-pressed="true">
      <span class="selectable-card__text">
        <span class="selectable-card__title">Negócio</span>
        <span class="selectable-card__desc">Não sei se essa ideia tem demanda real</span>
      </span>
      <img class="selectable-card__check" src="../../images/icons/ui/checkbox-checked.svg" alt="" />
    </button>

    <button class="selectable-card" type="button" aria-pressed="false">
      <span class="selectable-card__text">
        <span class="selectable-card__title">Marca</span>
        <span class="selectable-card__desc">Minha marca não gera confiança nem reconhecimento</span>
      </span>
      <img class="selectable-card__check" src="../../images/icons/ui/checkbox-unchecked.svg" alt="" />
    </button>
  </div>

  <script>
    document.querySelectorAll('.selectable-card').forEach(card => {
      card.addEventListener('click', () => {
        const selected = card.classList.toggle('is-selected');
        card.setAttribute('aria-pressed', String(selected));
        const check = card.querySelector('.selectable-card__check');
        check.src = selected
          ? '../../images/icons/ui/checkbox-checked.svg'
          : '../../images/icons/ui/checkbox-unchecked.svg';
      });
    });
  </script>
</body>
</html>
