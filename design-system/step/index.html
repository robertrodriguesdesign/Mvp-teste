<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fihan — Design System / Step</title>
  <style>
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("../../fonts/ibm-plex-mono/IBMPlexMono-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }

    :root {
      --bg: #EDEDED;
      --card-bg: #FFFFFF;
      --border: #DCDCDC;
      --text-dim: #6B6F73;

      --step-active-bg: #14CC52;
      --step-active-text: #202224;
      --step-inactive-bg: #D7D9DB;
      --step-inactive-text: #888C91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 40px 80px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #202224;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    h2 { font-size: 13px; margin: 32px 0 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .hint { font-size: 12px; color: var(--text-dim); margin: 0; }

    .step {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      padding: 7px 8px 8px 7px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 600;
      font-size: 24px;
      letter-spacing: -0.0125em;
      text-align: center;
    }
    .step--active {
      background: var(--step-active-bg);
      color: var(--step-active-text);
    }
    .step--inactive {
      background: var(--step-inactive-bg);
      color: var(--step-inactive-text);
    }

    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .state-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .label {
      font-size: 11px;
      color: var(--text-dim);
      font-family: ui-monospace, "IBM Plex Mono", monospace;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stepper-line {
      width: 32px;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>
  <h1>Step — Fihan</h1>
  <p class="hint">56×56 · IBM Plex Mono SemiBold 24px · sem raio</p>

  <h2>Estados</h2>
  <div class="row">
    <div class="state-card">
      <span class="step step--active">1</span>
      <span class="label">ATIVE — bg #14CC52</span>
    </div>
    <div class="state-card">
      <span class="step step--inactive">1</span>
      <span class="label">INATIVE — bg #D7D9DB</span>
    </div>
  </div>

  <h2>Exemplo de uso (stepper)</h2>
  <div class="stepper">
    <span class="step step--active">1</span>
    <span class="stepper-line"></span>
    <span class="step step--inactive">2</span>
    <span class="stepper-line"></span>
    <span class="step step--inactive">3</span>
  </div>
</body>
</html>
