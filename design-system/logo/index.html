<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fihan — Design System / Logo</title>
  <style>
    :root {
      --bg-light: #F5F5F5;
      --bg-dark: #111314;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #EDEDED;
    }
    h1 { font-size: 20px; margin: 0 0 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      max-width: 900px;
    }
    .cell {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .swatch {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 160px;
      border-radius: 8px;
    }
    .swatch.light { background: var(--bg-light); }
    .swatch.dark { background: var(--bg-dark); }
    .swatch img { width: 176px; height: 71px; }
    .label {
      font-size: 13px;
      color: #555;
      font-family: ui-monospace, "IBM Plex Mono", monospace;
    }
  </style>
</head>
<body>
  <h1>Logotipo — Fihan</h1>
  <div class="grid">
    <div class="cell">
      <div class="swatch light">
        <img src="../../images/brand/logo-dark-stroke.svg" alt="Logo Fihan escuro, com stroke" />
      </div>
      <span class="label">logo-dark-stroke.svg</span>
    </div>
    <div class="cell">
      <div class="swatch light">
        <img src="../../images/brand/logo-dark.svg" alt="Logo Fihan escuro" />
      </div>
      <span class="label">logo-dark.svg</span>
    </div>
    <div class="cell">
      <div class="swatch dark">
        <img src="../../images/brand/logo-light-stroke.svg" alt="Logo Fihan claro, com stroke" />
      </div>
      <span class="label">logo-light-stroke.svg</span>
    </div>
    <div class="cell">
      <div class="swatch dark">
        <img src="../../images/brand/logo-light.svg" alt="Logo Fihan claro" />
      </div>
      <span class="label">logo-light.svg</span>
    </div>
  </div>
</body>
</html>
