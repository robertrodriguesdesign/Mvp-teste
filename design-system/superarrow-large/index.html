<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fihan — Design System / Superarrow (grande)</title>
  <style>
    :root {
      --bg: #EDEDED;
      --card-bg: #FFFFFF;
      --border: #DCDCDC;
      --text: #202224;
      --text-dim: #6B6F73;
      --dark-bg: #111314;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 40px 80px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .hint { font-size: 12px; color: var(--text-dim); margin: 0 0 32px; }

    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .swatch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .swatch.light { background: var(--card-bg); }
    .swatch.dark { background: var(--dark-bg); border-color: var(--dark-bg); }
    .swatch img { width: 120px; height: 120px; }
    .label {
      font-size: 11px;
      color: var(--text-dim);
      font-family: ui-monospace, "IBM Plex Mono", monospace;
    }
    .swatch.dark .label { color: #9A9EA1; }
  </style>
</head>
<body>
  <h1>Superarrow (grande) — Fihan</h1>
  <p class="hint">120×120 · marca gráfica decorativa em pixel, 3 cores</p>

  <div class="row">
    <div class="swatch light">
      <img src="../../images/arrows/superarrow-verde.svg" alt="Superarrow verde" />
      <span class="label">superarrow-verde.svg</span>
    </div>
    <div class="swatch light">
      <img src="../../images/arrows/superarrow-cinza.svg" alt="Superarrow cinza" />
      <span class="label">superarrow-cinza.svg</span>
    </div>
    <div class="swatch dark">
      <img src="../../images/arrows/superarrow-branca.svg" alt="Superarrow branca" />
      <span class="label">superarrow-branca.svg</span>
    </div>
  </div>
</body>
</html>
