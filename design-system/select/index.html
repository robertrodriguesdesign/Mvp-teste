<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fihan — Design System / Select</title>
  <style>
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("../../fonts/ibm-plex-mono/IBMPlexMono-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    :root {
      --page-bg: #202224;
      --text-dim: #9A9EA1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 40px 80px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: #F9F9F9;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    h2 { font-size: 13px; margin: 32px 0 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .hint { font-size: 12px; color: var(--text-dim); margin: 0; }

    .row { display: flex; gap: 13px; flex-wrap: wrap; }

    .select-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border: 1px solid #65696E;
      background: transparent;
      color: #FAFAFA;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: -0.0273em;
      cursor: pointer;
    }
    .select-chip.is-selected {
      border-color: transparent;
      background: #14CC52;
      color: #202224;
    }
  </style>
</head>
<body>
  <h1>Select — Fihan</h1>
  <p class="hint">chip de seleção múltipla · IBM Plex Mono 11px</p>

  <h2>Estados</h2>
  <div class="row">
    <span class="select-chip">Opção</span>
    <span class="select-chip is-selected">Opção</span>
  </div>

  <h2>Interativo (clique para alternar)</h2>
  <div class="row" id="interactive">
    <button class="select-chip is-selected" type="button">Ainda é ideia</button>
    <button class="select-chip" type="button">Tenho MVP</button>
    <button class="select-chip" type="button">Já fatura</button>
    <button class="select-chip" type="button">Preciso escalar</button>
  </div>

  <script>
    document.querySelectorAll('#interactive .select-chip').forEach(chip => {
      chip.addEventListener('click', () => chip.classList.toggle('is-selected'));
    });
  </script>
</body>
</html>
