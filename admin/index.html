<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Fihan OS · Dashboard</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/images/brand/favicon.svg" />
  <link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>

  <div class="admin-shell">
    <aside class="admin-sidebar" data-admin-sidebar>
      <div class="admin-sidebar__brand">
        <img src="../images/brand/simbolo.svg" alt="" aria-hidden="true" style="width:20px;height:20px;object-fit:contain;" />
        <span>Fihan OS</span>
      </div>

      <nav class="admin-nav">
        <div class="admin-nav__group">
          <p class="admin-nav__eyebrow">[ Principal ]</p>
          <a class="admin-nav__item is-active" href="/admin">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 9L10 3l7 6M5 8v8h4v-5h2v5h4V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Dashboard
          </a>
          <a class="admin-nav__item" href="/admin/leads">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="7.5" cy="6.5" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 17c0-2.76 2.24-5 5-5s5 2.24 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="14.5" cy="7" r="2" stroke="currentColor" stroke-width="1.5"/><path d="M13 12.2c2.24.3 4 2.2 4 4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Leads
          </a>
        </div>
      </nav>

      <div class="admin-sidebar__user">
        <div class="admin-sidebar__avatar">F</div>
        <div class="admin-sidebar__user-info">
          <span class="admin-sidebar__user-name">Fihan</span>
          <span class="admin-sidebar__user-role">Super Admin</span>
        </div>
        <button class="admin-sidebar__logout" type="button" data-logout aria-label="Sair">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M8 3H4.5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 13.5L17 10l-4-3.5M17 10H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <main class="admin-content">
      <button class="admin-menu-toggle" type="button" data-nav-toggle aria-label="Abrir menu">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>

      <p class="admin-breadcrumb">
        <a href="/admin">Fihan OS</a> / <span class="admin-breadcrumb__current">Dashboard</span>
      </p>

      <div class="admin-header">
        <div>
          <h1 class="admin-header__title">Dashboard</h1>
          <p class="admin-header__desc">Visão geral dos leads recebidos pelo site.</p>
        </div>
      </div>

      <div class="admin-stats">
        <div class="admin-stat">
          <p class="admin-stat__label">Leads no período</p>
          <p class="admin-stat__value" data-stat="total">0</p>
          <p class="admin-stat__hint">Total de leads recebidos</p>
        </div>
        <div class="admin-stat">
          <p class="admin-stat__label">Dia com mais leads</p>
          <p class="admin-stat__value" data-stat="peak-day">—</p>
          <p class="admin-stat__hint">Pico de recebimento</p>
        </div>
        <div class="admin-stat">
          <p class="admin-stat__label">Média por dia</p>
          <p class="admin-stat__value" data-stat="avg">0</p>
          <p class="admin-stat__hint">Média no período filtrado</p>
        </div>
      </div>

      <div class="admin-filterbar">
        <div class="admin-filter__mode" role="radiogroup" aria-label="Tipo de filtro">
          <label class="admin-pill"><input type="radio" name="filter-mode" value="dia" checked /><span>Dia</span></label>
          <label class="admin-pill"><input type="radio" name="filter-mode" value="periodo" /><span>Período</span></label>
        </div>
        <input type="date" class="admin-date" data-field="date" aria-label="Dia" />
        <input type="date" class="admin-date" data-field="from" aria-label="De" hidden />
        <span class="admin-filter__sep" hidden>até</span>
        <input type="date" class="admin-date" data-field="to" aria-label="Até" hidden />
        <button class="admin-btn" type="button" data-action="apply-filter">Filtrar</button>
        <button class="admin-btn admin-btn--ghost" type="button" data-action="clear-filter">Limpar</button>
      </div>

      <div class="admin-card">
        <p class="admin-card__label">Leads por dia</p>
        <div class="admin-chart" data-chart></div>
      </div>
    </main>
  </div>

  <script src="../js/admin-shell.js" defer></script>
  <script src="../js/admin-dashboard.js" defer></script>
</body>
</html>
