<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Fihan OS · Usuários</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/images/brand/favicon.svg" />
  <link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>

  <div class="admin-shell">
    <aside class="admin-sidebar" data-admin-sidebar>
      <div class="admin-sidebar__brand">
        <img src="../images/brand/simbolo.svg" alt="" aria-hidden="true" style="width:20px;height:20px;object-fit:contain;" />
        <span>Fihan OS</span>
      </div>

      <nav class="admin-nav">
        <div class="admin-nav__group">
          <p class="admin-nav__eyebrow">[ Principal ]</p>
          <a class="admin-nav__item" href="/admin">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 9L10 3l7 6M5 8v8h4v-5h2v5h4V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Dashboard
          </a>
          <a class="admin-nav__item" href="/admin/leads">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="7.5" cy="6.5" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 17c0-2.76 2.24-5 5-5s5 2.24 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="14.5" cy="7" r="2" stroke="currentColor" stroke-width="1.5"/><path d="M13 12.2c2.24.3 4 2.2 4 4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Leads
          </a>
          <a class="admin-nav__item" href="/admin/conteudos">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5v11.5H5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 10h5M8 13.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Conteúdos
          </a>
          <a class="admin-nav__item is-active" href="/admin/usuarios">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="9" width="12" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Usuários
          </a>
        </div>
      </nav>

      <div class="admin-sidebar__user">
        <div class="admin-sidebar__avatar">F</div>
        <div class="admin-sidebar__user-info">
          <span class="admin-sidebar__user-name">Fihan</span>
          <span class="admin-sidebar__user-role">Super Admin</span>
        </div>
        <button class="admin-sidebar__logout" type="button" data-logout aria-label="Sair">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M8 3H4.5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 13.5L17 10l-4-3.5M17 10H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <main class="admin-content">
      <button class="admin-menu-toggle" type="button" data-nav-toggle aria-label="Abrir menu">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>

      <p class="admin-breadcrumb">
        <a href="/admin">Fihan OS</a> / <span class="admin-breadcrumb__current">Usuários</span>
      </p>

      <div class="admin-header">
        <div>
          <h1 class="admin-header__title">Usuários</h1>
          <p class="admin-header__desc">Quem pode entrar no painel. Cada pessoa usa o próprio e-mail e senha.</p>
        </div>
      </div>

      <div class="admin-table admin-table--usuarios">
        <div class="admin-table__scroll">
          <div class="admin-table__head">
            <span>Nome</span>
            <span>E-mail</span>
            <span>Criado em</span>
            <span></span>
          </div>
          <div data-usuarios>
            <p class="admin-empty" data-empty>Carregando…</p>
          </div>
        </div>
      </div>

      <form class="admin-form admin-form--usuario" data-form-usuario novalidate>
        <fieldset class="admin-form__grupo">
          <legend>[ Novo usuário ]</legend>
          <label class="admin-field">
            <span>Nome</span>
            <input type="text" name="nome" maxlength="120" autocomplete="off" />
          </label>
          <label class="admin-field">
            <span>E-mail</span>
            <input type="email" name="email" maxlength="200" autocomplete="off" />
          </label>
          <label class="admin-field">
            <span>Senha</span>
            <input type="password" name="senha" maxlength="200" autocomplete="new-password" />
            <small>Pelo menos 8 caracteres. A pessoa pode pedir a troca depois, por aqui.</small>
          </label>
          <p class="admin-form__msg" data-msg role="status" aria-live="polite"></p>
          <div class="admin-form__acoes">
            <button class="admin-btn admin-btn--primary" type="submit">Criar usuário</button>
          </div>
        </fieldset>
      </form>
    </main>
  </div>

  <script src="../js/admin-shell.js" defer></script>
  <script src="../js/admin-usuarios.js" defer></script>
</body>
</html>
