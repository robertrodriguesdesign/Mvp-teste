">prestação técnica e financeira do</text><text x="136" y="621" font-family="IBM Plex Sans" font-size="15" fill="#43464A">programa.</text><rect x="1050" y="495" width="340" height="150" rx="10" fill="#FAFAFA" stroke="#D7D9DB" stroke-width="2"/><text x="1076" y="539" font-family="IBM Plex Sans" font-weight="600" font-size="22" fill="#202224">Investidores</text><text x="1076" y="573" font-family="IBM Plex Sans" font-size="15" fill="#43464A">Problema validado, mercado</text><text x="1076" y="597" font-family="IBM Plex Sans" font-size="15" fill="#43464A">dimensionado, marca construída,</text><text x="1076" y="621" font-family="IBM Plex Sans" font-size="15" fill="#43464A">produto rodando.</text><circle cx="750.0" cy="360.0" r="118" fill="#FAFAFA" opacity="0.6"/><circle cx="750.0" cy="360.0" r="100" fill="#202224"/><text x="750.0" y="354.0" font-family="IBM Plex Sans" font-weight="700" font-size="24" fill="#FAFAFA" text-anchor="middle">O Ativo</text><text x="750.0" y="384.0" font-family="IBM Plex Sans" font-weight="700" font-size="24" fill="#FAFAFA" text-anchor="middle">Construído</text></svg>